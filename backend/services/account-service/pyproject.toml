[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "account-service"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgi-lifespan>=2.1.0",
    "asyncpg>=0.31.0",
    "asyncpg-stubs>=0.31.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.135.2",
    "fitz>=0.0.1.dev2",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "uvicorn>=0.42.0",
    "infra",
]

[tool.uv]
package = true

[tool.uv.sources]
infra = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests that must run on every pull request",
    "integration: integration tests against real external infrastructure",
    "e2e: end-to-end API tests with full service stack",
    "contract: HTTP contract validation tests",
    "smoke: fast critical-path tests for quick feedback",
]

[tool.hatch.build.targets.wheel]
packages = ["src/account_service"]
