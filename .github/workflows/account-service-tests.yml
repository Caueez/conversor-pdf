name: account-service-tests

on:
  pull_request:
  push:
    branches:
      - develop

env:
  APP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/user_service

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install workspace dependencies
        run: uv sync --all-packages
      - name: Run smoke suite
        run: uv run --package account-service pytest src/services/account-service/tests -m smoke -q

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install workspace dependencies
        run: uv sync --all-packages
      - name: Run unit suite with coverage gate
        run: >
          uv run --package account-service pytest src/services/account-service/tests
          -m unit
          --cov=account_service
          --cov=infra
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

  integration_e2e:
    name: integration-e2e
    if: github.event_name == 'push' || github.base_ref == 'develop'
    needs:
      - unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install workspace dependencies
        run: uv sync --all-packages
      - name: Run integration suite
        run: uv run --package account-service pytest src/services/account-service/tests -m integration
      - name: Run e2e + contract suite
        run: uv run --package account-service pytest src/services/account-service/tests -m "e2e or contract"

  full_suite:
    name: full-suite
    if: github.event_name == 'push' || github.base_ref == 'develop'
    needs:
      - smoke
      - integration_e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: user_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d user_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install workspace dependencies
        run: uv sync --all-packages
      - name: Run full suite
        run: uv run --package account-service pytest src/services/account-service/tests
